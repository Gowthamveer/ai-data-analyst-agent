[project]
name = "ai-data-analyst-agent"
version = "0.1.0"
description = "AI Data Analyst Agent"

dependencies = [
    "fastapi",
    "uvicorn",
    "pandas",
    "numpy",
    "pydantic",
    "scikit-learn",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "server.app:main"

[tool.openenv]
entrypoint = "server.app:main"
